<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | For Sale</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      background-color: #000;
      color: white;
    }

    .left {
      flex: 1;
      background-size: cover;
    }

    .right {
      flex: 1;
      background: radial-gradient(50% 50% at 50% 50%, #7cb22b 0%, #000000 94.23%);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form-container {
      text-align: center;
      width: 80%;
      max-width: 350px;
    }

    .form-container h2 {
      margin-bottom: 30px;
      font-size: 18px;
      font-weight: normal;
    }

    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: none;
      border-radius: 8px;
      background-color: #a7c4be;
      color: #000;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #00d25b;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .register {
      margin-top: 20px;
      font-size: 14px;
      color: #ccc;
    }

    .register a {
      color: white;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="left"><img src="../../public/assets/auth.png" alt="Something went wrong!" width="800" height="700"></div>
  <div class="right">
    <div class="form-container">
      <h2>Добро пожаловать!<br>Войдите или зарегистрируйтесь чтобы продолжить</h2>
      <form method="POST">
        <input type="email" name="email" placeholder="Введите email.." required>
        <input type="password" name="password" placeholder="Введите пароль.." required>
        <button type="submit">ВОЙТИ</button>
      </form>
      <div class="register">
        Нет аккаунта? <a href="/register">Зарегистрироваться</a>
      </div>
    </div>
  </div>
</body>
</html>
